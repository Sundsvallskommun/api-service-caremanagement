#========================================
# General settings
#========================================
logging:
  level:
    root: INFO
openapi:
  name: ${spring.application.name}
  title: ${spring.application.name}
  version: '@project.version@'
springdoc:
  swagger-ui:
    operationsSorter: alpha
    tagsSorter: alpha
spring:
  application:
    name: care-management
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: -1
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
  flyway:
    enabled: false
  jpa:
    properties:
      hibernate:
        type:
          # Store java.util.UUID as binary(16), not the native MariaDB UUID type.
          # Spring Modulith's event_publication.id follows that representation, matching our
          # MariaDB 10.6 environments and avoiding Hibernate's native UUID binding.
          preferred_uuid_jdbc_type: BINARY
      jakarta:
        persistence:
          schema-generation:
            database:
              action: none
  security:
    oauth2:
      client:
        registration:
          operaton:
            authorization-grant-type: client_credentials
            provider: operaton
          messaging:
            client-id: ${INTEGRATION_MESSAGING_CLIENT_ID}
            client-secret: ${INTEGRATION_MESSAGING_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            provider: messaging
          templating:
            client-id: ${INTEGRATION_TEMPLATING_CLIENT_ID}
            client-secret: ${INTEGRATION_TEMPLATING_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            provider: templating
          citizen:
            client-id: ${INTEGRATION_CITIZEN_CLIENT_ID}
            client-secret: ${INTEGRATION_CITIZEN_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            provider: citizen
          financial-aid:
            client-id: ${INTEGRATION_FINANCIAL_AID_CLIENT_ID}
            client-secret: ${INTEGRATION_FINANCIAL_AID_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            provider: financial-aid
          # The opt-in integration below keeps placeholder credentials, so a deploy that does not use it needs no
          # secrets for it: lifecare-integrator only wakes up when integration.lifecare-familycare.provider=integrator.
          lifecare-integrator:
            client-id: ${INTEGRATION_LIFECARE_INTEGRATOR_CLIENT_ID:placeholder}
            client-secret: ${INTEGRATION_LIFECARE_INTEGRATOR_CLIENT_SECRET:placeholder}
            authorization-grant-type: client_credentials
            provider: lifecare-integrator
        provider:
          messaging:
            token-uri: ${INTEGRATION_MESSAGING_TOKEN_URI}
          templating:
            token-uri: ${INTEGRATION_TEMPLATING_TOKEN_URI}
          citizen:
            token-uri: ${INTEGRATION_CITIZEN_TOKEN_URI}
          financial-aid:
            token-uri: ${INTEGRATION_FINANCIAL_AID_TOKEN_URI}
          lifecare-integrator:
            token-uri: ${INTEGRATION_LIFECARE_INTEGRATOR_TOKEN_URI:http://localhost/token}
#========================================
# Integration settings
#========================================
integration:
  operaton:
    connect-timeout: 5
    read-timeout: 30
  # lifecare-integrator — the route to FamilyCare that works from outside the municipal network. Only used when
  # integration.lifecare-familycare.provider=integrator; the credentials carry placeholders so a deploy on the direct
  # route needs none of them.
  # read-timeout 90: an attachment upload onto a Lifecare actualisation measured 41.5 s against the live API on
  # 2026-09-23, and the integrator's own read timeout to FamilyCare is raised to 90 to match. The two are equal rather
  # than staggered, so a FamilyCare call that runs the full 90 s may be cut here first; raise this above the
  # integrator's if that shows up. A cut here is not free — the timeout throws past the error decoder, so the failure
  # arrives without Lifecare's explanation.
  lifecare-integrator:
    url: ${INTEGRATION_LIFECARE_INTEGRATOR_URL:http://localhost/lifecare-integrator}
    connect-timeout: 5
    read-timeout: 90
  # Lifecare ProfessionalWeb — the internal api2 surface Lifecare's own web client uses (normberäkning editing, decisions,
  # payments, payees, reminders, journal notes, documents, job stimulus). Reached with a signed-in session of an
  # integration account (SAML via MobilityGuard), not an API key. url is the Lifecare host without a module path; leave it
  # unset and every ProfessionalWeb call answers 502 instead of the application failing to start. username/password are
  # secrets: environment only. Only reachable from a network that resolves the internal Lifecare host.
  lifecare-professionalweb:
    url: ${INTEGRATION_LIFECARE_PROFESSIONALWEB_URL:}
    domain: ${INTEGRATION_LIFECARE_PROFESSIONALWEB_DOMAIN:}
    federation-profile: ${INTEGRATION_LIFECARE_PROFESSIONALWEB_FEDERATION_PROFILE:}
    username: ${INTEGRATION_LIFECARE_PROFESSIONALWEB_USERNAME:}
    password: ${INTEGRATION_LIFECARE_PROFESSIONALWEB_PASSWORD:}
    # Test environments only: the decision maker to put on every decision while the caseworkers are not yet in
    # Lifecare's list of decision makers. Unset means the signed-in caseworker (X-Sent-By).
    test-decision-maker: ${INTEGRATION_LIFECARE_PROFESSIONALWEB_TEST_DECISION_MAKER:}
    session-ttl: 20m
    connect-timeout: 5
    read-timeout: 30
  # financial-aid (SSBTEK proxy). OAuth2 client-credentials via the financial-aid Spring security registration above.
  financial-aid:
    url: ${INTEGRATION_FINANCIAL_AID_URL}
    connect-timeout: 5
    read-timeout: 30
  messaging:
    url: ${INTEGRATION_MESSAGING_URL}
    connect-timeout: 5
    read-timeout: 30
  templating:
    url: ${INTEGRATION_TEMPLATING_URL}
    connect-timeout: 5
    read-timeout: 30
  citizen:
    url: ${INTEGRATION_CITIZEN_URL}
    connect-timeout: 5
    read-timeout: 30
  # Lifecare FamilyCare — financial assistance write-back (actualisation + calculation) + proposal lookups. Auth is domain + key
  # (query params / X-API-Key header); url is the FamilyCare base path (host + /WESE.FC.Api.FC). The key is sensitive — inject
  # via secret and keep it out of request logging.
  lifecare-familycare:
    # Which route answers the FamilyCare surface: `familycare` talks to Lifecare directly (only reachable from inside
    # the municipal network), `integrator` goes through api-service-lifecare-integrator. Declared explicitly so the
    # environment variable that switches it is named here rather than left to relaxed binding — the env form of
    # `lifecare-familycare` collapses the hyphen (INTEGRATION_LIFECAREFAMILYCARE_PROVIDER), which is easy to get wrong
    # and fails silently: a misspelled name binds some other property and the direct route just stays on.
    provider: ${INTEGRATION_LIFECARE_FAMILYCARE_PROVIDER:familycare}
    url: ${INTEGRATION_LIFECARE_FAMILYCARE_URL}
    domain: ${INTEGRATION_LIFECARE_FAMILYCARE_DOMAIN}
    key: ${INTEGRATION_LIFECARE_FAMILYCARE_KEY}
    # Separate licence key for the FamilyCare user directory (Users/*), which is licensed to its own consumer
    # ("Användarinformation IFO"). Optional — leave unset where one consumer covers both surfaces (and in mocked
    # environments) and `key` is used for every call.
    user-key: ${INTEGRATION_LIFECARE_FAMILYCARE_USER_KEY:}
    connect-timeout: 5
    read-timeout: 30
    # Lookback (months, ending at the reference date) for the financial assistance eligibility reads — actualisations, decisions, calculations.
    lookback-months: 13
    # FamilyCare actualisation Status values that count as an open case ("öppet ärende"), matched case-insensitively.
    # Reported as hasOpenCase on the eligibility response; it only drives the existence gate once
    # financial-assistance.eligibility.require-open-case is turned on. Confirm the vocabulary against production
    # Lifecare before adding values here.
    open-actualisation-statuses: Aktuell
#========================================
# Notification settings
#========================================
notification:
  ttl: P30D
scheduler:
  process-message-retry:
    cron: '0 * * * * *'
    name: process-message-retry
    shedlock-lock-at-most-for: PT5M
    maximum-execution-time: PT5M
  notification-cleanup:
    cron: '0 0 2 * * *'
    name: notification-cleanup
    shedlock-lock-at-most-for: PT5M
    maximum-execution-time: PT5M
  message-archive:
    cron: '0 30 3 * * *'
    name: message-archive
    shedlock-lock-at-most-for: PT30M
    maximum-execution-time: PT30M
#========================================
# Conversation archiving settings
#========================================
# Nightly job: snapshots the conversation of every closed financial assistance errand into {errandNumber}_meddelandehistorik.pdf once it
# has been closed (and untouched) for days-after-close days, then uploads it to the errand's Lifecare actualisation.
# The Lifecare document-type / sender-type codes are the numeric ids from the actualisation proposal's
# attachmentTypes (1 = "Inkommen handling", senderType 1 = "Den enskilde"). They are tenant-specific — override per
# environment. FamilyCare rejects anything non-numeric with "InsertDocumentType parameter not a number".
archive:
  message:
    municipality-id: 2281
    namespace: FINANCIAL_ASSISTANCE
    days-after-close: 30
    lifecare-document-type: ${ARCHIVE_MESSAGE_LIFECARE_DOCUMENT_TYPE:1}
    lifecare-document-sender-type: ${ARCHIVE_MESSAGE_LIFECARE_SENDER_TYPE:1}
    document-label: Meddelanden och bilagor från Draken
    lifecare-sender-name: Sundsvalls kommun
#========================================
# Lifecare actualisation settings
#========================================
# The catalogue entries verksamheten named for an EB återansökan (Regelverk Drakel 2026-09-21). Matched on the
# catalogue entry's name, case- and space-insensitively. A name that is not in the person's proposal falls back to the
# first offered value and is logged as a warning — an intake must never be blocked by a renamed catalogue entry, but a
# silent fallback is exactly the guess this configuration removes. Override per environment if Lifecare renames one.
# Not configured, and still "first offered": specify-type, working-status, service and investigation — verksamheten has
# not named them. The caseworker is resolved from the applicant's previous Lifecare service, not set from here; the
# regelverk's "Handläggare = Rakel" is an open question to verksamheten.
lifecare:
  actualisation:
    type: ${LIFECARE_ACTUALISATION_TYPE:Ek Återansökan Digital Ekonomiskt bistånd}
    from-who: ${LIFECARE_ACTUALISATION_FROM_WHO:Den enskilde}
    reason: ${LIFECARE_ACTUALISATION_REASON:Ekonomiskt bistånd}
    organisation: ${LIFECARE_ACTUALISATION_ORGANISATION:Ekonomiskt bistånd}
    new-application-type: ${LIFECARE_ACTUALISATION_NEW_APPLICATION_TYPE:EK Nyansökan Digital Ekonomiskt bistånd}
#========================================
# Financial assistance settings
#========================================
financial-assistance:
  eligibility:
    # Staleness bound for the per-month duplicate-application check: an ongoing caremanagement application older than
    # this no longer counts as "pågående" for the month it concerns. Whether an application blocks is decided by its
    # status (terminal statuses never block) — this is only the upper age limit.
    duplicate-window-days: 90
    # Require an open Lifecare case (hasOpenCase) — rather than any Lifecare footprint — for the existence gate. Off
    # until the FamilyCare actualisation status vocabulary is verified against production data; see
    # integration.lifecare-familycare.open-actualisation-statuses. An unknown status never locks an applicant out.
    require-open-case: ${FINANCIAL_ASSISTANCE_REQUIRE_OPEN_CASE:false}
    # "Recently closed inom X dagar" guard. When an applicant's previous financial assistance errand was closed this recently, the
    # eligibility check recommends a renewal (reasonCode RECENTLY_CLOSED) and surfaces the closed errand, and a freshly
    # created errand is frozen as NEEDS_MANUAL_REVIEW (no aktualisering, no arkivering) for a caseworker to reopen in
    # Lifecare and release. Policy value — confirm the day count with legal/jurist.
    recently-closed-window-days: 30
    # TEST OVERRIDE, off by default: when true the eligibility check short-circuits and returns all three application
    # types (new/renewal/supplementary application) regardless of any existing case, so the frontend can exercise all
    # three flows. Only ever set FINANCIAL_ASSISTANCE_RETURN_ALL_TYPES=true in a throwaway test environment — it
    # bypasses the real common-entry-point routing, including the protected-identity gate.
    return-all-types: ${FINANCIAL_ASSISTANCE_RETURN_ALL_TYPES:false}
  lifecare:
    # The Lifecare ServiceId(s) an ekonomiskt bistånd decision is made under. FamilyCare's decision list carries every
    # IFO decision on the person (Vux, BoU, LVM, utredningar …); the Lifecare decision listing keeps only these, and the
    # decision proposal's previous decision is the newest of them that covers a period. A Lifecare catalogue id
    # (2 in Lifecare test), so override per environment. Comma-separated.
    decision-service-ids: ${FINANCIAL_ASSISTANCE_LIFECARE_DECISION_SERVICE_IDS:2}
  decision-proposal:
    # FLAG-05: how far back (months, ending at the application month) återkrav are looked for in Lifecare. Money owed
    # back stays owed across many applications, so this reaches further than the previous-decision lookup; FamilyCare's
    # decision read has no balance, so a claim since repaid or forgiven is shown too and the caseworker checks it.
    recovery-claim-lookback-months: ${FINANCIAL_ASSISTANCE_RECOVERY_CLAIM_LOOKBACK_MONTHS:36}
