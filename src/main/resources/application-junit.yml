#========================================
# Test profile settings (junit tests)
#========================================
# Bind the test server to the loopback address the test clients call. On a wildcard bind (the default) macOS hands
# the random port out even when another local process already listens on 127.0.0.1 at that number - IntelliJ's
# SonarLint backend holds a dozen such ports - and the test client, calling localhost, then reaches that process
# instead: a whole test class fails with 400/404 from a server that is not ours (seen 2026-09-24, Apache-HttpCore on
# 127.0.0.1:64120). Bound to 127.0.0.1, the random port is only ever one that is free there.
server:
  address: 127.0.0.1
logging:
  level:
    root: INFO
integration:
  operaton:
    url: http://operaton.url
  lifecare-familycare:
    url: http://lifecarefamilycare.url
    domain: junit-domain
    key: junit-key
    user-key: junit-user-key
  financial-aid:
    url: http://financialaid.url
  messaging:
    url: http://messaging.url
  templating:
    url: http://templating.url
  citizen:
    url: http://citizen.url
scheduler:
  notification-cleanup:
    cron: '-'
    name: notification-cleanup
    shedlock-lock-at-most-for: PT5M
    maximum-execution-time: PT5M
  message-archive:
    cron: '-'
    name: message-archive
    shedlock-lock-at-most-for: PT5M
    maximum-execution-time: PT5M
caremanagement:
  identifier:
    required: false
financial-assistance:
  eligibility:
    return-all-types: false
spring:
  cache:
    type: none
  datasource:
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    url: jdbc:tc:mariadb:10.6:///junittest
  jpa:
    properties:
      jakarta:
        persistence:
          schema-generation:
            database:
              action: update
  security:
    oauth2:
      client:
        provider:
          operaton:
            token-uri: http://token.url
          messaging:
            token-uri: http://token.url
          templating:
            token-uri: http://token.url
          citizen:
            token-uri: http://token.url
          financial-aid:
            token-uri: http://token.url
        registration:
          operaton:
            client-id: the-client-id
            client-secret: the-client-secret
          messaging:
            client-id: the-client-id
            client-secret: the-client-secret
          templating:
            client-id: the-client-id
            client-secret: the-client-secret
          citizen:
            client-id: the-client-id
            client-secret: the-client-secret
          financial-aid:
            client-id: the-client-id
            client-secret: the-client-secret
