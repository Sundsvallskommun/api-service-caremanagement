#========================================
# Test profile settings (IT tests)
#========================================
# Bind the test server to the loopback address the test clients call. On a wildcard bind (the default) macOS hands
# the random port out even when another local process already listens on 127.0.0.1 at that number - IntelliJ's
# SonarLint backend holds a dozen such ports - and the test client, calling localhost, then reaches that process
# instead: a whole test class fails with 400/404 from a server that is not ours (seen 2026-09-24, Apache-HttpCore on
# 127.0.0.1:64120). Bound to 127.0.0.1, the random port is only ever one that is free there.
server:
  address: 127.0.0.1
logging:
  level:
    root: INFO
caremanagement:
  identifier:
    required: false
financial-assistance:
  eligibility:
    return-all-types: false
integration:
  operaton:
    url: http://localhost:${wiremock.server.port:}/api-operaton
  financial-aid:
    url: http://localhost:${wiremock.server.port:}/api-financial-aid
  messaging:
    url: http://localhost:${wiremock.server.port:}/api-messaging
  templating:
    url: http://localhost:${wiremock.server.port:}/api-templating
  citizen:
    url: http://localhost:${wiremock.server.port:}/api-citizen
  lifecare-familycare:
    url: http://localhost:${wiremock.server.port:}/api-lifecare-familycare
    domain: it-domain
    key: it-key
spring:
  datasource:
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    url: jdbc:tc:mariadb:10.6:///
  flyway:
    enabled: true
  jpa:
    properties:
      jakarta:
        persistence:
          schema-generation:
            database:
              action: validate
  security:
    oauth2:
      client:
        provider:
          operaton:
            token-uri: http://localhost:${wiremock.server.port:}/api-gateway/token
          messaging:
            token-uri: http://localhost:${wiremock.server.port:}/api-gateway/token
          templating:
            token-uri: http://localhost:${wiremock.server.port:}/api-gateway/token
          citizen:
            token-uri: http://localhost:${wiremock.server.port:}/api-gateway/token
          financial-aid:
            token-uri: http://localhost:${wiremock.server.port:}/api-gateway/token
        registration:
          operaton:
            client-id: the-client-id
            client-secret: the-client-secret
          messaging:
            client-id: the-client-id
            client-secret: the-client-secret
          templating:
            client-id: the-client-id
            client-secret: the-client-secret
          citizen:
            client-id: the-client-id
            client-secret: the-client-secret
          financial-aid:
            client-id: the-client-id
            client-secret: the-client-secret
