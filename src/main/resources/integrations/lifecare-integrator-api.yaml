  /{municipalityId}/professional-web/services/{serviceId}/payments:
    post:
      tags:
        - ProfessionalWeb payments
      summary: Register a payment on a service
      description: "Lifecare's api2/Payment/Create. The body is sent to Lifecare as\
        \ it is, and not sent again unless Lifecare refuses it for a missing session"
      operationId: createPayment
      parameters:
        - name: municipalityId
          in: path
          description: Municipality id
          required: true
          schema:
            type: string
          example: 2281
        - name: serviceId
          in: path
          description: The Lifecare service (insats) id
          required: true
          schema:
            type: integer
            format: int64
            exclusiveMinimum: 0
          example: 42
      requestBody:
        content:
          application/json:
            schema:
              type: object
        required: true
      responses:
