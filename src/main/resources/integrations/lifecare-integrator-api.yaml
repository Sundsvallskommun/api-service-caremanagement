openapi: 3.1.0
info:
  title: api-lifecare-integrator
  contact: { }
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
  version: "1.0"
servers:
  - url: http://localhost:64555
    description: Generated server url
tags:
  - name: Investigations
    description: Investigation reads from the Lifecare family care system
  - name: ProfessionalWeb decisions
    description: "Lifecare ProfessionalWeb decisions (beslut), with Lifecare's JSON\
    \ passed through untouched"
  - name: ProfessionalWeb documents
    description: "Lifecare ProfessionalWeb journal notes and documents, with Lifecare's\
    \ JSON passed through untouched"
  - name: ProfessionalWeb job stimulus
    description: "Lifecare ProfessionalWeb job stimulus (jobbstimulans), with Lifecare's\
    \ JSON passed through untouched"
  - name: Executions
    description: Execution reads from the Lifecare family care system
  - name: ProfessionalWeb reminders
    description: "Lifecare ProfessionalWeb reminders, with Lifecare's JSON passed through\
    \ untouched"
  - name: Person
    description: Person master data and contacts from Lifecare family care
  - name: Payments
    description: Payment reads from the Lifecare family care system
  - name: Documents
    description: Documents stored for a person in the Lifecare family care system
  - name: ProfessionalWeb calculations
    description: "Lifecare ProfessionalWeb calculations (beräkningar), with Lifecare's\
    \ JSON passed through untouched"
  - name: ProfessionalWeb payments
    description: "Lifecare ProfessionalWeb payments (utbetalningar), payees and households,\
    \ with Lifecare's JSON passed through untouched"
  - name: Actualisations
    description: Actualisation (case intake) resource for the Lifecare family care system
  - name: Resource allocations
    description: Resource allocation reads from the Lifecare family care system
  - name: Decisions
    description: "Unified decision resource, merging the Lifecare elderly care (SoL\
    \ + LSS) and family care decision sources"
  - name: ProfessionalWeb
    description: Pass-through to Lifecare ProfessionalWeb for api-service-caremanagement
  - name: Calculations
    description: Calculation (normberäkning) resource for the Lifecare family care system
  - name: Services
    description: Service reads from the Lifecare family care system
  - name: Users
    description: Caseworker (user) lookup in the Lifecare family care system
  - name: ProfessionalWeb prints
    description: "Lifecare ProfessionalWeb prints, Lifecare's own PDF of a calculation,\
    \ a decision or a document"
paths:
  /{municipalityId}/professional-web/reminders/{reminderId}:
    get:
      tags:
        - ProfessionalWeb reminders
      summary: Get a reminder
      description: Lifecare's api2/Reminders/GetReminderEditComposite
      operationId: getReminder
      parameters:
        - name: municipalityId
          in: path
          description: Municipality id
          required: true
          schema:
            type: string
          example: 2281
        - name: reminderId
          in: path
          description: The Lifecare reminder id
          required: true
          schema:
            type: integer
            format: int64
            exclusiveMinimum: 0
          example: 7
      responses:
        "200":
          description: Lifecare's answer
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Problem"
                  - $ref: "#/components/schemas/ConstraintViolationProblem"
        "403":
          description: Lifecare does not let the integration account do this
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Lifecare found nothing there
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: "Lifecare refused the request, with Lifecare's text"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: "Lifecare could not be reached, would not give a session or\
            \ answered with an error"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    put:
      tags:
        - ProfessionalWeb reminders
      summary: Update a reminder
      description: "Lifecare's api2/Reminders/UpdateReminder. The body is sent to\
        \ Lifecare as it is, and its reminderId must be the one in the path"
      operationId: updateReminder
      parameters:
        - name: municipalityId
          in: path
          description: Municipality id
          required: true
          schema:
            type: string
          example: 2281
        - name: reminderId
          in: path
          description: The Lifecare reminder id
          required: true
          schema:
            type: integer
            format: int64
            exclusiveMinimum: 0
          example: 7
      requestBody:
        content:
          application/json:
            schema:
              type: object
        required: true
      responses:
        "204":
          description: Updated
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Problem"
                  - $ref: "#/components/schemas/ConstraintViolationProblem"
        "403":
          description: Lifecare does not let the integration account do this
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Lifecare found nothing there
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: "Lifecare refused the request, with Lifecare's text"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: "Lifecare could not be reached, would not give a session or\
            \ answered with an error"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      tags:
        - ProfessionalWeb reminders
      summary: Remove a reminder
      description: Lifecare's api2/Reminders/RemoveReminder
      operationId: removeReminder
      parameters:
        - name: municipalityId
          in: path
          description: Municipality id
          required: true
          schema:
