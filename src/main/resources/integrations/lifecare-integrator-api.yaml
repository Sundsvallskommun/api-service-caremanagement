components:
  schemas:
    Problem:
      type: object
      properties:
        instance:
          type: string
          format: uri
        type:
          type: string
          format: uri
        title:
          type: string
        detail:
          type: string
        status:
          type: integer
          format: int32
    ConstraintViolationProblem:
      type: object
      properties:
        type:
          type: string
          format: uri
        status:
          type: integer
          format: int32
        violations:
          type: array
          items:
            $ref: "#/components/schemas/Violation"
        title:
          type: string
        instance:
          type: string
          format: uri
        detail:
          type: string
    Violation:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
    JsonNode:
      type: object
      properties:
        empty:
          type: boolean
        array:
          type: boolean
        "null":
          type: boolean
        object:
          type: boolean
        float:
          type: boolean
        container:
          type: boolean
        string:
          type: boolean
        short:
          type: boolean
        int:
          type: boolean
        double:
          type: boolean
        textual:
          type: boolean
          deprecated: true
        boolean:
          type: boolean
        long:
          type: boolean
        pojo:
          type: boolean
        binary:
          type: boolean
        number:
          type: boolean
        floatingPointNumber:
          type: boolean
        missingNode:
          type: boolean
        valueNode:
          type: boolean
        bigInteger:
          type: boolean
        integralNumber:
          type: boolean
        bigDecimal:
          type: boolean
        nodeType:
          type: string
          enum:
            - ARRAY
            - BINARY
            - BOOLEAN
            - MISSING
            - "NULL"
            - NUMBER
            - OBJECT
            - POJO
            - STRING
        embeddedValue:
          type: boolean
    ProfessionalWebExchangeRequest:
      type: object
      description: One Lifecare ProfessionalWeb call to make through the integration
        account's session
      properties:
        method:
          type: string
          description: HTTP method
          examples:
            - GET
          minLength: 1
        path:
          type: string
          description: Path below WESE.FC.ProfessionalWeb
          examples:
            - api2/Calculation/GetCalculation
          minLength: 1
          pattern: "^(?!.*/\\.\\.(?:/|$))(api2|RenderPdf)/[A-Za-z0-9/_.-]+$"
        params:
          type: object
          additionalProperties:
            type: string
          description: "Query parameters, in order"
        body:
          $ref: "#/components/schemas/JsonNode"
          description: JSON body for a POST or DELETE
        form:
          type: array
          description: "Form fields for a POST sent as a browser form (application/x-www-form-urlencoded),\
            \ in document order. A name may repeat. Only for method POST, and not\
            \ together with body."
          items:
            $ref: "#/components/schemas/ProfessionalWebFormField"
      required:
        - method
        - path
    ProfessionalWebFormField:
      type: object
      description: One field of a browser form
      properties:
        name:
          type: string
          description: "Field name, which may repeat across the fields of one form"
          examples:
            - 51_0_2_1
          minLength: 1
        value:
          type: string
          description: "Field value, empty when the field has none"
          examples:
            - "true"
      required:
        - name
        - value
    ProfessionalWebExchangeResponse:
      type: object
      description: "Lifecare's answer to one ProfessionalWeb call, whatever its status"
      properties:
        status:
          type: integer
          format: int32
          description: "Lifecare's status, including its own codes such as 461"
          examples:
            - 200
        contentType:
          type: string
          description: Lifecare's content type
          examples:
            - application/json; charset=utf-8
        body:
          type: string
          description: "The raw body, base64 encoded"
    CalculationExpenseRequest:
      type: object
      description: An expense or special expense included in a calculation
      properties:
        typeId:
          type: integer
          format: int32
          description: "The id of the expense type, from the calculation proposal's\
            \ expenseTypes or specialExpenseTypes"
          examples:
            - 1
        amount:
          type: number
          description: The amount of the expense
          examples:
            - 5000.0
        approvedAmount:
          type: number
          description: The approved amount of the expense
          examples:
            - 4500.0
        note:
          type: string
          description: A note on the expense
          examples:
            - Hyra april
      required:
        - typeId
    CalculationIncomeRequest:
      type: object
      description: An income included in a calculation
      properties:
        typeId:
          type: integer
          format: int32
          description: "The id of the income type, from the calculation proposal's\
            \ incomeTypes"
          examples:
            - 1
        applicantAmount:
          type: number
          description: The applicant's amount
          examples:
            - 5000.0
        applicantAmountDate:
          type: string
          format: date
          description: The date of the applicant's amount
          examples:
            - 2026-05-01
        coApplicantAmount:
          type: number
          description: The co-applicant's amount
          examples:
            - 5000.0
        coApplicantAmountDate:
          type: string
          format: date
          description: The date of the co-applicant's amount
          examples:
            - 2026-05-01
        note:
          type: string
          description: A note on the income
          examples:
            - Lön april
      required:
        - typeId
    CalculationPersonRequest:
      type: object
      description: A person included in a calculation
      properties:
        partyId:
          type: string
          description: The party id of the person
          examples:
            - 81471222-5798-11e9-ae24-57fa13b361e1
        numberOfDays:
          type: integer
          format: int32
          description: The number of days the person is included in the calculation
          examples:
            - 30
        deviationFromDate:
          type: string
          format: date
          description: The date the deviation is valid from
          examples:
            - 2026-05-01
        deviationToDate:
          type: string
          format: date
          description: The date the deviation is valid to
          examples:
            - 2026-05-31
      required:
        - partyId
    CreateCalculationRequest:
      type: object
      description: Request to create a calculation in Lifecare FC. All ids come from
        the calculation proposal endpoint.
      properties:
        partyId:
          type: string
          description: The party id of the person the calculation concerns
          examples:
            - 81471222-5798-11e9-ae24-57fa13b361e1
        serviceId:
          type: integer
          format: int32
          description: "The id of the service to link to, from the calculation proposal\
            \ endpoint"
          examples:
            - 12345
        investigationId:
          type: integer
          format: int32
          description: "The id of the investigation to link to, from the calculation\
            \ proposal endpoint"
          examples:
            - 12345
        normId:
          type: integer
          format: int32
          description: "The id of the norm to base the calculation on, from the calculation\
            \ proposal endpoint"
          examples:
            - 1
        actualisationId:
          type: integer
          format: int32
          description: "The id of the actualisation to link to, from the calculation\
            \ proposal endpoint"
          examples:
            - 12345
        calculationDate:
          type: string
          format: date
          description: The date of the calculation
          examples:
            - 2026-05-01
        calculationFromDate:
          type: string
          format: date
          description: The date the calculation is valid from
          examples:
            - 2026-05-01
        calculationToDate:
          type: string
          format: date
          description: The date the calculation is valid to
          examples:
            - 2026-05-31
        hasCustomHouseholdSize:
          type: boolean
          description: Whether a custom household size is used
          examples:
            - false
        householdSize:
          type: integer
          format: int32
          description: The size of the household
          examples:
            - 4
        persons:
          type: array
          items:
            $ref: "#/components/schemas/CalculationPersonRequest"
            description: The persons included in the calculation
        incomes:
