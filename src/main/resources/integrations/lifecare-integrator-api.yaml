  /{municipalityId}/professional-web/exchange:
    post:
      tags:
        - ProfessionalWeb
      summary: Make one Lifecare ProfessionalWeb call through the integration account's
        session
      description: "For api-service-caremanagement, which cannot reach Lifecare from\
        \ outside the municipal network. The integrator signs in as its integration\
        \ account, keeps the session and handles Lifecare's session escalation; the\
        \ caller decides what to call and interprets the answer. Lifecare's answer\
        \ is returned as data with this endpoint's own status 200, whatever Lifecare\
        \ answered, so the gateway cannot rewrite Lifecare's own codes or a PDF. Only\
        \ api2 and RenderPdf paths are reachable. A POST can carry either a JSON body\
        \ or the fields of a browser form, for pages that answer with a form to fill\
        \ in."
      operationId: exchange
      parameters:
        - name: municipalityId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfessionalWebExchangeRequest"
        required: true
      responses:
        "200":
          description: Lifecare answered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfessionalWebExchangeResponse"
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Problem"
                  - $ref: "#/components/schemas/ConstraintViolationProblem"
        "502":
          description: Lifecare could not be reached or would not give a session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
