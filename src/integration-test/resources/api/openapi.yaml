            \ CASE_DATA (ärendeuppgifter — a case-data document for the errand), DECISION\
            \ (beslut — a decision document for the errand) or MESSAGE_HISTORY (meddelandehistorik\
            \ — the archived conversation PDF for a closed errand)"
          enum:
          - APPLICATION
          - CONVERSATION
          - GENERATED
          - ERRAND
          - CASE_DATA
          - DECISION
          - MESSAGE_HISTORY
