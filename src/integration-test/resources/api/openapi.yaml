      description: "Streams a single Lifecare document's content (the generated PDF)\
        \ straight from Lifecare. caremanagement only forwards the bytes. The document\
        \ must belong to the given applicant (partyId) — a document id not in that\
        \ applicant's list for the period yields 404, so a caller cannot read another\
        \ applicant's document by its Lifecare id. 502 when Lifecare is unreachable;\
        \ Lifecare answers 404 when the document has no generated PDF (content exists\
        \ only for PDF-backed document types)."
      operationId: readDocumentContent
      parameters:
      - name: municipalityId
        in: path
        required: true
        schema:
          type: string
      - name: namespace
        in: path
        required: true
        schema:
          type: string
          pattern: "[\\w\\-]+"
      - name: documentId
        in: path
        description: The Lifecare document id
        required: true
        schema:
          type: string
      - name: partyId
        in: query
        description: The applicant's partyId (personId GUID) that owns the document
        required: true
        schema:
          type: string
      - name: from
        in: query
        description: Inclusive start of the ownership-check period (ISO date). Defaults
          to 24 months before 'to'.
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        description: Inclusive end of the ownership-check period (ISO date). Defaults
          to today.
        required: false
        schema:
          type: string
          format: date
      responses:
        "200":
          description: Successful Operation
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "502":
          description: Bad Gateway
          content:
