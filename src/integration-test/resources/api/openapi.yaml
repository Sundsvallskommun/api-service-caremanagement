  /{municipalityId}/{namespace}/errands/financial-assistance/{errandId}/lifecare/reminders/{reminderId}:
    put:
      tags:
      - Financial Assistance · Lifecare
      summary: Change a bevakning on the errand's insats
      description: "Changes the date, text, priority or status of a bevakning (also\
        \ how it is marked done). A changed date may not be in the past; an unchanged\
        \ one may. 404 when Lifecare does not list the bevakning on this errand's\
        \ insats."
      operationId: updateReminder
      parameters:
      - name: municipalityId
        in: path
        required: true
        schema:
          type: string
      - name: namespace
        in: path
        required: true
        schema:
          type: string
          pattern: "[\\w\\-]+"
      - name: errandId
        in: path
        required: true
        schema:
          type: string
      - name: reminderId
        in: path
        description: The Lifecare reminder id
        required: true
        schema:
          type: integer
          format: int32
          exclusiveMinimum: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LifecareReminderRequest"
        required: true
      responses:
        "204":
          description: Successful Operation
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/Problem"
                - $ref: "#/components/schemas/ConstraintViolationProblem"
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Conflict - the errand has no Lifecare insats yet
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: Bad Gateway
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      tags:
      - Financial Assistance · Lifecare
      summary: Remove a bevakning from the errand's insats
      description: Removes a bevakning in Lifecare. 404 when Lifecare does not list
        the bevakning on this errand's insats.
      operationId: removeReminder
      parameters:
      - name: municipalityId
        in: path
        required: true
        schema:
          type: string
      - name: namespace
        in: path
        required: true
        schema:
          type: string
          pattern: "[\\w\\-]+"
      - name: errandId
        in: path
        required: true
        schema:
          type: string
      - name: reminderId
        in: path
