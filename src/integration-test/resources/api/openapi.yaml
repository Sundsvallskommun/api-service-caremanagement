              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: Bad Gateway
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    put:
      tags:
      - Financial Assistance · Lifecare
      summary: Save an edit to a journalanteckning
      description: "Saves the body, date, time and optionally skrivskydd onto Lifecare's\
        \ own record. 404 when the record is not in the applicant's Lifecare record;\
        \ 409 when it is finalised or locked in Lifecare."
      operationId: updateJournalNote
      parameters:
      - name: municipalityId
        in: path
        required: true
        schema:
          type: string
      - name: namespace
        in: path
        required: true
        schema:
          type: string
          pattern: "[\\w\\-]+"
      - name: errandId
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: The Lifecare record id
        required: true
        schema:
          type: integer
          format: int32
          exclusiveMinimum: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLifecareRecordRequest"
        required: true
      responses:
        "200":
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecareRecordContent"
        "409":
          description: Conflict - the record is finalised in Lifecare
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Lifecare refused the edit
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/Problem"
                - $ref: "#/components/schemas/ConstraintViolationProblem"
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: Bad Gateway
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
