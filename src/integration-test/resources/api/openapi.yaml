  /{municipalityId}/{namespace}/errands/financial-assistance/actualisations/{actualisationId}/archive:
    post:
      tags:
      - Financial Assistance · Intake
      summary: Archive a document to a Lifecare actualisation
      description: "Binds an uploaded document (e.g. a supplementary application —\
        \ tilläggsansökan) as an attachment to a specific Lifecare actualisation.\
        \ Multipart request: the 'file' part carries the document; the optional 'request'\
        \ part carries the metadata (errandId, title, documentType, documentSenderType,\
        \ senderName) — title/documentType/documentSenderType/senderName each fall\
        \ back to a server default, and the title defaults to the uploaded file name.\
        \ caremanagement only forwards the bytes to Lifecare. When 'request.errandId'\
        \ is set, the target actualisation id is recorded on that errand as a Decision(ACTUALISATION),\
        \ setting the errand's Lifecare actualisation to the one archived to."
      operationId: archiveToActualisation
      parameters:
      - name: municipalityId
        in: path
        required: true
        schema:
          type: string
      - name: namespace
        in: path
        required: true
        schema:
          type: string
          pattern: "[\\w|\\-]+"
      - name: actualisationId
        in: path
        description: The target Lifecare actualisation id
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                request:
                  $ref: "#/components/schemas/ArchiveActualisationRequest"
              required:
              - file
      responses:
        "204":
          description: Successful operation
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: Bad Gateway
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
