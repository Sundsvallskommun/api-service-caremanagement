          - Civilstånd
        inputType:
          type: string
          description: The input kind as rendered
          enum:
          - RADIO
          - CHECKBOX
          - SELECT
          - TEXT
          - TEXTAREA
          - NUMBER
          - DATE
          - BOOLEAN_TOGGLE
          - REPEATING_GROUP
          - STATIC
          examples:
          - RADIO
        helpText:
          type: string
          description: "The help text shown for the field, if any"
          examples:
          - Ange ditt civilstånd vid ansökningstillfället.
        infoTexts:
          type: array
          description: "Info texts shown for the field, in order"
          items:
            type: string
        notices:
          type: array
          description: "Info / warning / error notices rendered for the field, in\
            \ order"
          items:
            $ref: "#/components/schemas/FormSnapshotNotice"
        options:
          type: array
          description: "All options as presented (for RADIO/CHECKBOX/SELECT), in order"
          items:
            $ref: "#/components/schemas/FormSnapshotOption"
        answer:
          $ref: "#/components/schemas/FormSnapshotAnswer"
          description: "The answer given, when the field has a single answer"
        items:
          type: array
          description: "For REPEATING_GROUP fields, one entry per repeated instance"
          items:
            $ref: "#/components/schemas/FormSnapshotGroup"
        required:
          type: boolean
          description: Whether the field was required as rendered
          examples:
          - true
        visible:
          type: boolean
          description: Whether the field was visible to the applicant
          examples:
          - true
        condition:
          type: string
          description: "The visibility rule that was active, human-readable"
          examples:
          - always
    FormSnapshotGroup:
      type: object
      description: "One repeated instance of a REPEATING_GROUP field — its nested\
