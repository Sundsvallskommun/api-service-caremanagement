          maxLength: 8192
          minLength: 0
      required:
      - outcome
    FinalizeRequest:
      type: object
      description: "Finalize a financial assistance errand: record the decision and\
        \ resume the process. Carries no payments - Draken registers them directly\
        \ in Lifecare, and the process reads them from there. A payments field from\
        \ an older client is ignored. Leave out decision to have careM read the beslut\
        \ saved in Lifecare."
      properties:
        decision:
          $ref: "#/components/schemas/FinalizeDecision"
          description: "The decision. Optional: when left out, careM reads the beslut\
            \ the errand is linked to in Lifecare (lifecareDecisionId) and records\
            \ that - its outcome from the beslutstyp, orsak, period, amount (0 for\
            \ an avslag) and beslutsmeddelande."
        communication:
          $ref: "#/components/schemas/CommunicationChannels"
          description: The channels chosen for sending the calculation and decision
            to the applicant
        householdSizeChanged:
          type: boolean
          description: Whether the caseworker changed the household size (gemensamma
            kostnader) in the calculation draft. Recorded on the errand and served
            on the view. Defaults to false.
          examples:
          - false
      required:
      - communication
    FinalizeResponse:
      type: object
      description: "The receipt of a finalize — decision id, process correlation and\
        \ the communication channels to act on."
      properties:
        decisionId:
          type: string
          description: Id of the PAYMENT decision recorded on the errand
          examples:
          - cb20c51f-fcf3-42c0-b613-de563634a8ec
        processMessageCorrelated:
          type: boolean
          description: "Whether the PaymentDecisionReceived message reached the process.\
            \ False means it did not reach it now — the errand stays AWAITING_DECISION\
            \ and the message is queued and re-sent automatically (at most an hour\
            \ apart, for three days). Draken should say so; correlating by hand through\
            \ the process-messages endpoint is only needed if the retry gives up."
          examples:
          - true
        communication:
          $ref: "#/components/schemas/CommunicationChannels"
          description: The communication channels chosen — the frontend sends the
            decision through these
        lifecareDecision:
          $ref: "#/components/schemas/LifecareDecisionRegistration"
          description: "How the recorded decision was tied to the errand's beslut\
            \ in Lifecare (lifecareDecisionId). careM receipts it itself, so a client\
            \ no longer has to post .../decisions/{decisionId}/lifecare-result after\
            \ finalizing."
          readOnly: true
      readOnly: true
    LifecareDecisionRegistration:
      type: object
      description: How the finalized decision was tied to its beslut in Lifecare.
      properties:
        decisionId:
          type: string
          description: The PAYMENT decision careM recorded
          examples:
          - cb20c51f-fcf3-42c0-b613-de563634a8ec
        outcome:
          type: string
          description: "REGISTERED: the beslut is in Lifecare and the decision is\
            \ marked SYNCED with its id"
          enum:
          - REGISTERED
          - FAILED
          - NOT_SENT
          examples:
          - REGISTERED
        lifecareId:
          type: string
          description: Lifecare's decisionId
          examples:
          - "98"
        detail:
          type: string
          description: "What went wrong, when something did"
      readOnly: true
