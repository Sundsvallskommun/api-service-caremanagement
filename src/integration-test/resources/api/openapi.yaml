          type: string
          format: date
          description: Valid until and including. Open-ended when omitted.
          examples:
          - 2031-09-01
        conditions:
          type: string
          description: Conditions for the permit
          examples:
          - Unloading may only take place during daytime.
          maxLength: 4096
          minLength: 0
        status:
          type: string
          description: Status
          enum:
          - ACTIVE
          - REVOKED
          examples:
          - ACTIVE
        created:
          type: string
          format: date-time
          description: Created
          readOnly: true
        modified:
          type: string
          format: date-time
          description: Modified
          readOnly: true
    Notification:
      type: object
      description: "User-facing notification raised against an errand. Mutable: callers\
        \ acknowledge (acknowledged=true) when the recipient has seen it and mark\
        \ it handled (handled=true) when the recipient has acted on it; expired notifications\
        \ are purged by a background job."
      properties:
        id:
          type: string
          description: Unique identifier
          examples:
          - cb20c51f-fcf3-42c0-b613-de563634a8ec
          readOnly: true
        errandId:
          type: string
          description: Id of the errand the notification belongs to (server-assigned
            from path)
          examples:
          - b82bd8ac-1507-4d9a-958d-369261eecc15
          readOnly: true
        ownerId:
          type: string
          description: User id of the recipient (the user who should see this notification)
          examples:
          - jane01doe
          maxLength: 64
          minLength: 0
        createdBy:
          type: string
          description: User or system id that produced the notification. Automatically
            acknowledged if equal to ownerId.
          examples:
          - john02doe
          maxLength: 64
          minLength: 0
        type:
          type: string
          description: Notification type
          enum:
          - CREATE
          - UPDATE
          - DELETE
          examples:
          - CREATE
        typeDisplayName:
          type: string
          description: Swedish display name for the notification type
          examples:
          - Skapad
          readOnly: true
        subType:
          type: string
          description: Notification sub-type
          enum:
          - ERRAND
          - DECISION
          - ATTACHMENT
          - STAKEHOLDER
          - PARAMETER
          - MESSAGE
          - SYSTEM
          examples:
          - ERRAND
        subTypeDisplayName:
          type: string
          description: Swedish display name for the notification sub-type
          examples:
          - Ärende
          readOnly: true
        description:
          type: string
          description: Short human-readable description
          examples:
          - Nytt ärende har tilldelats dig
        content:
          type: string
          description: Optional longer content / body
          examples:
          - You have been assigned a new errand regarding financial assistance.
        acknowledged:
          type: boolean
          description: "Acknowledgement state - the recipient has seen the notification.\
            \ On PATCH, null leaves the value unchanged; true/false sets it. The bulk-acknowledge\
            \ endpoint flips this to true for every notification on an errand."
          examples:
          - false
        handled:
          type: boolean
          description: "Handled state - the recipient has acted on the notification,\
            \ not merely seen it. On PATCH, null leaves the value unchanged; true/false\
            \ sets it, and setting it to true also acknowledges the notification.\
            \ The bulk-handle endpoint flips this to true for every notification on\
            \ an errand."
          examples:
          - false
        expires:
          type: string
          format: date-time
          description: Timestamp after which the notification is eligible for cleanup
            (server-assigned)
          readOnly: true
        created:
          type: string
          format: date-time
          description: Creation timestamp (server-assigned)
          readOnly: true
        modified:
          type: string
          format: date-time
          description: Last-modified timestamp (server-assigned)
          readOnly: true
