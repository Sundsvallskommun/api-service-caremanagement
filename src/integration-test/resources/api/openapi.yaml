  /{municipalityId}/{namespace}/errands/financial-assistance/{errandId}/ssbtek:
    get:
      tags:
      - Financial Assistance · SSBTEK
      summary: "Read the SSBTEK basis of an errand's applicant, co-applicant or child"
      description: "The SSBTEK basis of the errand's applicant (or, with person=CO_APPLICANT,\
        \ co-applicant; with person=CHILD and childPartyId, one of the household children\
        \ named on the application), fetched live via api-service-financial-aid and\
        \ forwarded verbatim — the answer per responding agency (af, csn, fk, skv,\
        \ so, tns, miv), so a caseworker can see what the composite service actually\
        \ said rather than only the classified result. The person is resolved from\
        \ the errand, never taken from the caller, and the read is recorded in the\
        \ errand's access log like every other errand-scoped request. No personnummer\
        \ is accepted or returned at this edge, and nothing is stored. The period\
        \ is resolved in whole months and echoed on the response: it defaults to the\
        \ three SSBTEK rule periods (jämförelseperiod M−2 through ansökningsperiod\
        \ M), the same window the process asks for. Agency payload shapes are heterogeneous\
        \ and follow the SSBTEK contract, so they are not modelled here."
      operationId: getBasis
      parameters:
      - name: municipalityId
        in: path
        required: true
        schema:
          type: string
      - name: namespace
        in: path
        required: true
        schema:
          type: string
          pattern: "[\\w\\-]+"
      - name: errandId
        in: path
        required: true
        schema:
          type: string
      - name: person
        in: query
        description: "Whose basis: the errand's APPLICANT (default), CO_APPLICANT\
          \ or a CHILD (then childPartyId is required)"
        required: false
        schema:
          type: string
          default: APPLICANT
      - name: childPartyId
        in: query
        description: "The partyId of the household child to read. Required with person=CHILD,\
          \ rejected otherwise."
        required: false
        schema:
          type: string
      - name: from
        in: query
        description: Inclusive start of the period (ISO date). Defaults to the first
          day of month M−2.
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        description: Inclusive end of the period (ISO date). Defaults to the last
          day of the current month.
        required: false
        schema:
          type: string
          format: date
      responses:
        "200":
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SsbtekBasis"
        "404":
          description: "Not Found — no such errand, no household member in that role,\
            \ no such child in the household, or an unknown citizen"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: Bad Gateway
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
