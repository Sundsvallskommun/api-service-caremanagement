        attestedAt:
          type: string
          format: date-time
          description: When the application was attested
          examples:
          - 2026-06-01T09:30:00Z
        lifecareDecisionId:
          type: integer
          format: int32
          description: "Reference to the Lifecare decision (beslut) the errand concerns,\
            \ set by Draken once the beslut is saved in Lifecare. A reference only:\
            \ whether the beslut is locked (skrivskyddat) is Lifecare's status and\
            \ is never stored here. finalize requires it for every outcome."
          examples:
          - 4711
        lifecareCalculationId:
          type: integer
          format: int32
          description: "Reference to the Lifecare normberäkning (calculation) the\
            \ errand concerns. Set by the daily prepare when it creates the proposal\
            \ in Lifecare, or by Draken when it saves a calculation for an errand\
            \ that has none; once set it is not replaced by the prepare step. Draken\
            \ updates this calculation rather than creating another. A reference only:\
            \ whether the calculation is final (slutlig) is Lifecare's status and\
            \ is never stored here. finalize requires it for a granting outcome (BIFALL/DELAVSLAG)."
          examples:
          - 4242
        lifecarePaymentIds:
          type: array
          description: "References to the Lifecare payments (utbetalningar) a bifall\
            \ pays with. Set either by Draken once it has registered a payment in\
            \ Lifecare, or by careM itself once payment-status has found the errand's\
            \ payments paid in Lifecare on the errand's own insats. When given in\
            \ a PATCH the list replaces the stored one; an empty list clears it. References\
            \ only: whether a payment is registered or paid out is read from Lifecare,\
            \ never stored here. When set, payment-status verifies exactly these ids\
            \ against Lifecare, and no other errand can take them; finalize refuses\
            \ an AVSLAG that carries any."
          items:
            type: string
            examples:
            - "90210"
            maxLength: 64
            minLength: 0
        children:
          type: array
          description: Children included in the application
          items:
            $ref: "#/components/schemas/Child"
        costs:
          type: array
          description: Costs applied for
          items:
            $ref: "#/components/schemas/Cost"
        incomes:
          type: array
          description: Incomes reported
          items:
            $ref: "#/components/schemas/Income"
