    Notification:
      type: object
      description: "User-facing notification raised against an errand. Mutable: callers\
        \ acknowledge (acknowledged=true) when the recipient has seen it; expired\
        \ notifications are purged by a background job."
      properties:
        id:
          type: string
          description: Unique identifier
          examples:
          - cb20c51f-fcf3-42c0-b613-de563634a8ec
          readOnly: true
        errandId:
          type: string
          description: Id of the errand the notification belongs to (server-assigned
