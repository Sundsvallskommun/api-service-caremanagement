    get:
      tags:
      - Errands
      summary: Find errands
      description: Query for errands with optional spring-filter expression
      operationId: findErrands
      parameters:
      - name: municipalityId
        in: path
        description: Municipality id
        required: true
        schema:
          type: string
        example: 2281
      - name: namespace
        in: path
        description: Namespace
        required: true
        schema:
          type: string
          pattern: "[\\w\\-]+"
        example: MY_NAMESPACE
      - name: filter
        in: query
        description: "Syntax description: [spring-filter](https://github.com/turkraft/spring-filter/blob/85730f950a5f8623159cc0eb4d737555f9382bb7/README.md#syntax)"
        required: false
        schema:
          type: string
        example: status:'NEW' and created>'2024-01-01T00:00:00.000+01:00'
      - name: hasUnacknowledgedNotifications
        in: query
        description: "When true, only errands that have at least one unacknowledged\
          \ notification are returned. Combine with notificationOwnerId to scope to\
          \ a single recipient."
        required: false
        schema:
          type: boolean
          default: false
        example: true
      - name: hasUnhandledNotifications
        in: query
        description: "When true, only errands that have at least one notification\
          \ not yet marked handled are returned. Handled is a state of its own: a\
          \ message may have been read without having been dealt with. Combine with\
          \ notificationOwnerId to scope to a single recipient."
        required: false
        schema:
          type: boolean
          default: false
        example: true
      - name: notificationOwnerId
        in: query
        description: Scopes the notification filters to notifications addressed to
          this recipient (caseworker). Only applied when hasUnacknowledgedNotifications=true
          or hasUnhandledNotifications=true.
        required: false
        schema:
          type:
          - string
          - "null"
        example: jane01doe
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          default:
          - "touched,DESC"
          items:
            type: string
      responses:
        "200":
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindErrandsResponse"
        "400":
          description: Bad request
