          type: string
          description: The section title the applicant saw
          examples:
          - Hushåll
        description:
          type: string
          description: "The section-level description / info text, if any"
          examples:
          - Uppgifter om din familj
        visible:
          type: boolean
          description: Whether the section was visible to the applicant
          examples:
          - true
        fields:
          type: array
          description: "The fields in the section, in render order"
