  /{municipalityId}/{namespace}/errands/financial-assistance/{errandId}/finalize:
    post:
      tags:
      - Financial Assistance · Finalize
      summary: Besluta och utbetala — finalize the errand (caseworker)
      description: "Records the caseworker's decision as a PAYMENT decision on the\
        \ errand, stores the chosen communication channels and household-size flag,\
        \ and correlates PaymentDecisionReceived to the process (paymentDecision APPROVED\
        \ for BIFALL/DELAVSLAG, REJECTED otherwise) — which sets GRANTED/REJECTED\
        \ and, for a bifall, reads the payments from Lifecare until they are paid\
        \ out. Leave out decision to have careM read the beslut the errand is linked\
        \ to in Lifecare (lifecareDecisionId) and record that: its outcome from the\
        \ beslutstyp's category, orsak, period, amount and beslutsmeddelande; 400\
        \ when no beslut is saved or its beslutstyp cannot be finalized, 422 when\
        \ the beslut breaks the decision's rules. The recorded decision is receipted\
        \ against the Lifecare beslut in the same call (marked SYNCED with lifecareId,\
        \ reported as lifecareDecision), so posting .../lifecare-result afterwards\
        \ is no longer needed (and harmless). Creates no payments: Draken registers\
        \ them directly in Lifecare. Every outcome requires the beslut to be saved\
        \ in Lifecare and linked as lifecareDecisionId; a BIFALL/DELAVSLAG also requires\
        \ the normberäkning saved in Lifecare and linked as lifecareCalculationId,\
        \ otherwise 409. An AVSLAG linked to Lifecare payments (lifecarePaymentIds)\
        \ is refused with 409. A decision on a normberäkning linked as lifecareCalculationId\
        \ purges careM's calculation draft: the decided calculation is Lifecare's,\
        \ and the draft read answers 404 from then on. Does not send anything to the\
        \ applicant: the response echoes the communication channels for the frontend\
        \ to act on. Requires the errand in AWAITING_DECISION and an identified caller\
        \ (X-Sent-By); a second finalize is rejected with 409. A process that could\
        \ not be reached is reported in the response, not as an error."
      operationId: finalize
      parameters:
      - name: municipalityId
        in: path
        required: true
        schema:
