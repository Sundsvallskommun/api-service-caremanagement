openapi: 3.1.0
info:
  title: care-management
  contact: {}
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
  version: "1.0"
servers:
- url: http://localhost:54924
  description: Generated server url
security:
- sentBy: []
tags:
- name: Financial Assistance · Proposals
  description: The decision proposal (beslutsförslag) — derived on every read from
    the calculation draft and the applicant's Lifecare history; only the section warnings
    it raises are stored. Recomputed when the CALCULATION section is approved.
- name: Statistics
  description: Read-only errand statistics for the caseworker interface
- name: Co-caseworkers
  description: "Co-caseworkers (medhandläggare) added to an errand alongside its ordinary\
    \ caseworker. Both the caseworker and every co-caseworker receive the errand's\
    \ notifications as one shared, logical message."
- name: Permits
  description: "Permits issued on an errand: validity period, conditions and status.\
    \ Revoking sets the status to REVOKED."
- name: Financial Assistance · Finalize
  description: "Besluta och utbetala: record the caseworker's decision and resume\
    \ the process. The Lifecare writes (beslut, payments, bevakningar, journal, documents,\
    \ and the normberäkning beyond the daily prepare's proposal) are made by Draken's\
    \ BFF directly in Lifecare before the decision; the errand only carries the references\
    \ (lifecareCalculationId, lifecareDecisionId, lifecarePaymentIds). The decision\
    \ is sent to the applicant by the frontend."
- name: Financial Assistance · Lifecare
  description: "The applicant's case in Lifecare. The history reads (calculations,\
    \ decisions, documents keyed by partyId, period defaulting to the last 24 months)\
    \ go through the FamilyCare API. The errand-scoped routes under /{errandId}/lifecare\
    \ read and write Lifecare ProfessionalWeb on the caseworker's behalf: normberä\
    kning, beslut, utbetalningar, betalningsmottagare, bevakningar, journal, dokument\
    \ and jobbstimulans. careM derives every Lifecare key from the errand, logs each\
    \ access on the errand and links what it creates back onto it."
- name: Conversation
  description: Messages between caseworker and applicant on an errand
- name: Financial Assistance · Monitorings
  description: "Financial assistance monitorings — date-bound watch/reminder objects\
    \ on an errand, with full CRUD. Unlike the income warnings they carry no acknowledge\
    \ lifecycle."
- name: Financial Assistance · Household identifiers
  description: "The errand number and the household's personal numbers, served on\
    \ demand to the process's beredning step (prepare-income-basis) so they never\
    \ become process variables. Every read lands in the errand's event log."
- name: User settings
  description: Per-user (AD account) settings
- name: Notifications
  description: User-facing notifications raised against an errand. Recipients (`ownerId`)
    acknowledge them when seen and mark them handled when acted on; expired ones are
    purged by a daily background job.
- name: Status History
  description: Status transition log for an errand
- name: Metadata
  description: Metadata (lookup) operations
- name: Namespace config
  description: Namespace configuration operations
- name: Financial Assistance · SSBTEK
  description: "Read the applicant's SSBTEK basis live — the answer per responding\
    \ agency (af/csn/fk/skv/so/tns/miv), forwarded verbatim so a caseworker can see\
    \ the source behind the classified incomes. Keyed by partyId (resolved to a personnummer\
    \ via the citizen service); the period defaults to the three rule periods (M−\
    2 through M). caremanagement only forwards the read and stores nothing."
- name: Process messages
  description: Send BPMN message correlation events to the process instance currently
    running for an errand
- name: Financial Assistance · Intake
  description: "Pre-application and case-intake calls: eligibility routing (common\
    \ entry point), renewal pre-fill from Lifecare, the income/cost type metadata\
    \ catalogue, and Lifecare actualisation (case intake)."
- name: Financial Assistance · Warnings
  description: "Acknowledgeable financial assistance income warnings on an errand\
    \ — create, list and set status (OPEN / ACKNOWLEDGED / CLOSED). The daily prepare\
    \ step reconciles them."
- name: Notes
  description: Notes attached to an errand
- name: Errand stakeholders
  description: Errand stakeholder operations
- name: Errand Types
  description: "Describes the errand types: their statuses, stakeholder roles and\
    \ the fields a type's data payload should carry, as form guidance for clients."
- name: Referrals
  description: "Referrals/consultations on an errand: receiving authority, due date,\
    \ free-text response and status (SENT → RESPONDED)."
- name: Financial Assistance · Payees
  description: "The betalningsmottagare selectable for an errand's payment form: the\
    \ payees seen on the applicant's Lifecare payments in the last 12 months, plus\
    \ the ones added by hand here when the history does not contain the right one.\
    \ FamilyCare exposes no payee register, so a past payment is the only evidence\
    \ a payee exists. Reading is side-effect free."
- name: Event Log
  description: "Who/what/when activity log for an errand — every read and write, with\
    \ the acting user"
- name: Journal
  description: Journalanteckningar (case-journal entries) attached to an errand
- name: Errand decisions
  description: "Decision audit trail on an errand. Stores both system-generated decisions\
    \ (e.g. DMN-evaluated recommendations from a BPMN process) and human decisions\
    \ (e.g. caseworker APPROVE/REJECT), distinguished by `decisionType`."
- name: Financial Assistance · Calculation
  description: "The calculation: prepare the calculation draft each daily loop (no\
    \ Lifecare write — Draken saves the normberäkning in Lifecare), and read or edit\
    \ the draft header."
- name: Financial Assistance · Payment
  description: Read from Lifecare whether the payments a bifall is linked to have
    been paid out. caremanagement makes no payment and stores no payment status.
- name: Financial Assistance · Errands
  description: "Create, read and replace financial assistance errands. Create against\
    \ one of the three application-type slugs (financial-assistance-new / -renewal\
    \ / -supplementary); read and replace the typed data via the shared financial-assistance\
    \ path."
- name: Documents
  description: Formal case documents attached to an errand
- name: Errands
  description: Errand operations
- name: Financial Assistance · Draft rows
  description: "Caseworker edits to the draft calculation rows — add, edit, soft-delete\
    \ and restore income, expense and person rows. Each touches only the caseworker\
    \ value / note / soft-delete; the process columns are owned by the daily prepare."
- name: Errand attachments
  description: Errand attachment operations
paths:
  /{municipalityId}/{namespace}/errands/{errandId}/notifications/handled:
    put:
      tags:
      - Notifications
      summary: Mark all notifications on an errand handled
      description: Sets `handled=true` (and with it `acknowledged=true`) on every
        notification belonging to the errand that is not already handled.
      operationId: handleAll
      parameters:
      - name: municipalityId
        in: path
        required: true
        schema:
          type: string
        example: 2281
      - name: namespace
        in: path
        required: true
        schema:
          type: string
          pattern: "[\\w\\-]+"
        example: MY_NAMESPACE
      - name: errandId
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Successful operation
        "404":
          description: Errand not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/Problem"
                - $ref: "#/components/schemas/ConstraintViolationProblem"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /{municipalityId}/{namespace}/errands/{errandId}/notifications/acknowledged:
    put:
      tags:
      - Notifications
      summary: Acknowledge all notifications on an errand
      description: Sets `acknowledged=true` on every unacknowledged notification belonging
        to the errand.
      operationId: acknowledgeAll
      parameters:
      - name: municipalityId
        in: path
        required: true
        schema:
          type: string
        example: 2281
      - name: namespace
        in: path
        required: true
        schema:
          type: string
          pattern: "[\\w\\-]+"
        example: MY_NAMESPACE
      - name: errandId
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Successful operation
        "404":
          description: Errand not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/Problem"
                - $ref: "#/components/schemas/ConstraintViolationProblem"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /{municipalityId}/{namespace}/errands/financial-assistance/{errandId}/monitorings/{monitoringId}:
