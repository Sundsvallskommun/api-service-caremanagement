      properties:
        types:
          type: array
          description: Selectable document types
          items:
            $ref: "#/components/schemas/DocumentType"
    DocumentType:
      type: object
      description: A selectable document type — the code and the Swedish Lifecare
        label.
      properties:
        code:
          type: string
          description: The type code
          examples:
          - LETTER
        displayName:
          type: string
          description: Human-readable Swedish label (the Lifecare 'Typ' value)
          examples:
          - Brev
    CountResponse:
      type: object
      description: Count of errands matching the supplied filter
      properties:
        count:
          type: integer
          format: int64
          description: Number of matching errands
          examples:
          - 42
    ErrandTypeSchema:
      type: object
      description: "Form descriptor for an errand type slug — statuses, roles and\
        \ the fields its data payload should carry."
      properties:
        typeSlug:
          type: string
          description: The errand type slug
          examples:
          - financial-assistance-renewal
        applicationType:
          type: string
          description: "The application-type variant the slug maps to, when the type\
            \ exposes one; null otherwise"
          examples:
          - RENEWAL
        displayName:
          type: string
          description: Human-readable display name of the type
          examples:
          - Ekonomiskt bistånd – återansökan
        statuses:
          type: array
          description: "Allowed statuses for the type — code plus human-readable display\
            \ name, in lifecycle order"
          items:
            $ref: "#/components/schemas/StatusDefinition"
        roles:
          type: array
          description: Stakeholder roles valid for the type
          items:
            $ref: "#/components/schemas/RoleDefinition"
        fields:
          type: array
          description: "The fields the type's data payload should carry, as form guidance"
          items:
            $ref: "#/components/schemas/FieldDescriptor"
        decisionOptions:
          type: array
          description: The allowed decision outcomes (decision alternatives) a caseworker
            may record on the type; empty when the type defines none
          items:
            $ref: "#/components/schemas/DecisionOption"
    FieldDescriptor:
      type: object
      description: Form-guidance descriptor for a single data field of an errand type.
      properties:
        name:
          type: string
          description: The data field name
          examples:
          - maritalStatus
        type:
          type: string
          description: The field kind
          enum:
          - STRING
          - BOOLEAN
          - INTEGER
          - DECIMAL
          - DATE_TIME
          - ENUM
          - ARRAY
          examples:
          - ENUM
        required:
          type: boolean
          description: True when the field is unconditionally required for the application
            types it applies to
          examples:
          - true
        options:
          type: array
          description: "Allowable values when type is ENUM, otherwise null"
          examples:
          - - SINGLE
            - COHABITING
          items:
            type: string
        itemsRef:
          type: string
          description: "For ARRAY fields, the OpenAPI component name of the element\
            \ shape (resolve via /api-docs); null otherwise"
          examples:
          - Cost
        appliesTo:
          type: array
          description: The application types that collect this field
          examples:
          - - NEW
            - RENEWAL
          items:
            type: string
        condition:
          type: string
          description: "Human-readable gate describing when the field is collected,\
            \ when conditional; null when always collected"
          examples:
          - periodChoice == OTHER_BENEFIT
        description:
          type: string
          description: Short description of the field
          examples:
          - Marital status of the applicant
    RoleDefinition:
      type: object
      properties:
        code:
          type: string
        displayName:
          type: string
        maxOccurrences:
          type: integer
          format: int32
        required:
          type: boolean
    StatusDefinition:
      type: object
      description: An allowed status for an errand type — the stored code plus its
        human-readable label.
      properties:
        code:
          type: string
          description: The status code stored on the errand
          examples:
          - UNDER_REVIEW
        displayName:
          type: string
          description: Human-readable label for the status
          examples:
          - Under utredning
  securitySchemes:
    sentBy:
      type: apiKey
      description: "Caller identity, e.g. 'joe001doe; type=adAccount' or '<uuid>;\
        \ type=partyId'. Not authentication - it is the actor recorded in the errand\
        \ event log."
      name: X-Sent-By
      in: header
