  /{municipalityId}/{namespace}/errands/{errandId}/attachments:
    get:
      tags:
      - Errand attachments
      summary: List attachments
      description: "Fetches all attachment metadata for the errand (application files,\
        \ generated PDFs, manual uploads and conversation attachments), oldest first.\
        \ Optionally filtered by origin and/or sender role."
      operationId: readAttachments
      parameters:
      - name: municipalityId
        in: path
        description: Municipality id
        required: true
        schema:
          type: string
        example: 2281
      - name: namespace
        in: path
        description: Namespace
        required: true
        schema:
          type: string
          pattern: "[\\w|\\-]+"
        example: MY_NAMESPACE
      - name: errandId
        in: path
        description: Errand id
        required: true
        schema:
          type: string
      - name: origin
        in: query
        description: Only return attachments with this origin
        required: false
        schema:
          type: string
          enum:
          - APPLICATION
          - CONVERSATION
          - GENERATED
          - ERRAND
          - CASE_DATA
          - DECISION
      - name: senderRole
        in: query
        description: Only return attachments from this sender
        required: false
        schema:
          type: string
          enum:
          - CLIENT
          - CASEWORKER
      responses:
        "200":
          description: Successful Operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Attachment"
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/Problem"
                - $ref: "#/components/schemas/ConstraintViolationProblem"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      tags:
      - Errand attachments
      summary: Create attachment
      description: "Uploads a new attachment for the errand. The optional origin tags\
        \ what the file is: ERRAND (a plain manual upload, the default), CASE_DATA\
        \ (ärendeuppgifter — a case-data document) or DECISION (beslut — a decision\
        \ document). A CASE_DATA attachment is renamed to {errandNumber}.pdf and only\
        \ one is allowed per errand — uploading a second returns 400."
      operationId: createAttachment
      parameters:
      - name: municipalityId
        in: path
        description: Municipality id
        required: true
        schema:
          type: string
        example: 2281
      - name: namespace
        in: path
        description: Namespace
        required: true
        schema:
          type: string
          pattern: "[\\w|\\-]+"
        example: MY_NAMESPACE
      - name: errandId
        in: path
        description: Errand id
        required: true
        schema:
          type: string
      - name: origin
        in: query
        description: "What the uploaded file is: ERRAND (a plain manual upload, the\
          \ default), CASE_DATA (ärendeuppgifter — a case-data document) or DECISION\
          \ (beslut — a decision document). Defaults to ERRAND when omitted."
        required: false
        schema:
          type: string
          enum:
          - ERRAND
          - CASE_DATA
          - DECISION
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
        required: true
      responses:
        "201":
          description: Successful operation
          headers:
            Location:
              style: simple
              schema:
                type: string
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/Problem"
                - $ref: "#/components/schemas/ConstraintViolationProblem"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
