        lifecareChecked:
          type: boolean
          description: True when the Lifecare lookup succeeded. False means the answer
            is degraded (empty children).
          examples:
          - true
    FinancialAssistanceMetadata:
      type: object
      description: "Financial assistance type catalogue for the frontend dropdowns:\
        \ income and cost types with labels, groups and the citizen flag."
      properties:
        incomeTypes:
          type: array
          description: The income types
          items:
            $ref: "#/components/schemas/TypeOption"
        costTypes:
          type: array
          description: "The cost types, grouped by their Mina-sidor form section"
          items:
            $ref: "#/components/schemas/TypeOption"
        moneyTypes:
          type: array
          description: The payment money types (Payment.moneyType allowed values).
            Placeholder — the real catalogue comes from Lifecare and isn't known yet.
          items:
            $ref: "#/components/schemas/TypeOption"
        paymentMethods:
          type: array
          description: The payment methods (Payment.paymentMethod allowed values).
            Placeholder — the real catalogue comes from Lifecare and isn't known yet.
          items:
            $ref: "#/components/schemas/TypeOption"
    TypeOption:
      type: object
      description: "A selectable financial assistance income/cost type — the payload\
        \ code plus its Mina-sidor + Lifecare labels, form group and citizen flag."
      properties:
        code:
          type: string
          description: "The type code, as stored on the payload (incomeType / costType)"
          examples:
          - RENT
        externalDisplayName:
          type: string
          description: The citizen Mina-sidor label; null for caseworker-only types
            not on the citizen form
          examples:
          - Hyra (inte parkering/garage)
        internalDisplayName:
          type: string
          description: "The matching Lifecare caseworker dropdown label, or null when\
            \ there is no Lifecare counterpart"
          examples:
          - Boendekostnad
        group:
          type: string
          description: Stable code for the Mina-sidor form section the type is shown
            under; null for income
          enum:
          - HOUSING
          - WORK_AND_STUDIES
          - HEALTH
          - OTHER
          examples:
          - HOUSING
        citizenReportable:
          type: boolean
          description: "Whether an applicant may report the type, i.e. whether the\
            \ code is accepted on the citizen payload. Does not control what the Mina-sidor\
            \ form renders — that list is maintained in the frontend."
          examples:
          - true
    LifecareDecisionReason:
