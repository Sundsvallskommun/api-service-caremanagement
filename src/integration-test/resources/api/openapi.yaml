            \ warnings' are PAYMENT, a LIFECARE_READ_FAILED is on the tab whose warnings\
            \ depend on the failed read (its sourceKey), everything else is CALCULATION"
          enum:
          - CALCULATION
          - DECISION
          - PAYMENT
          examples:
          - CALCULATION
          readOnly: true
        sourceKey:
          type: string
          description: A stable key for the income the warning concerns (benefit/incomeType)
            — the dedup key
          examples:
          - Bostadsbidrag
        message:
          type: string
          description: Human-readable warning text (Swedish)
          examples:
          - "Saknas fortfarande i SSBTEK: Dagersättning"
        status:
          type: string
          description: The warning status (machine code; use statusDisplayName for
            the label)
          enum:
          - OPEN
          - ACKNOWLEDGED
          - CLOSED
          examples:
          - OPEN
        statusDisplayName:
          type: string
          description: Swedish display name for the warning status
          examples:
          - Öppen
          readOnly: true
        autoResolved:
          type: boolean
          description: Whether the warning was closed automatically (its cause resolved)
            rather than by a caseworker
          examples:
          - false
        created:
          type: string
          format: date-time
          description: When the warning was created
          readOnly: true
        updated:
          type: string
          format: date-time
          description: When the warning was last updated
          readOnly: true
