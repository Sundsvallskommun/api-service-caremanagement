            $ref: "#/components/schemas/FormSnapshotField"
    DecisionOption:
      type: object
      description: An allowed decision outcome (decision alternatives) for an errand
        type.
      properties:
        code:
          type: string
          description: "The decision outcome code, stored on the Decision row's value"
          examples:
          - BIFALL
        displayName:
          type: string
          description: Human-readable label for the outcome
          examples:
          - Bifall
        carriesAmount:
          type: boolean
          description: "Whether the outcome carries an amount — true for outcomes\
            \ that grant an amount, false for ones that imply 0 (e.g. a rejection)"
          examples:
          - true
    DecisionProposal:
      type: object
      description: "The decision proposal (beslutsförslag) — derived data, recomputed\
        \ on every read."
      properties:
        outcome:
          type: string
          description: "The proposed decision outcome. Rule: estimatedAmount <= 0\
            \ → AVSLAG; estimatedAmount > 0 and every expense fully approved → BIFALL;\
            \ estimatedAmount > 0 and any expense approved below the applied amount\
            \ → DELAVSLAG. Null when no amount could be estimated (see explanation)"
          enum:
          - BIFALL
          - DELAVSLAG
          - AVSLAG
          examples:
          - BIFALL
        outcomeOptions:
          type: array
          description: Every outcome the caseworker can pick instead — the errand
            type's decision catalogue
          items:
            $ref: "#/components/schemas/DecisionOption"
        periodFrom:
          type: string
          format: date
          description: The proposed decision period start — the calculation's period
          examples:
          - 2026-06-01
        periodTo:
          type: string
          format: date
          description: The proposed decision period end — the calculation's period
          examples:
          - 2026-06-30
        concernedMonth:
          type: string
          description: The calculation's application month (YYYY-MM)
          examples:
          - 2026-06
        estimatedAmount:
          type: number
          description: "The bistånd the outcome is decided on; positive is an underskott,\
            \ zero or negative an överskott. When the normberäkning is saved in Lifecare\
            \ (lifecareCalculationId) this is its result as Lifecare computed it (-balance)\
            \ — amountBasis LIFECARE_CALCULATION. Before that, or when the saved calculation\
            \ cannot be read, it is estimated: normSum + expenseSum + specialExpenseSum\
            \ − incomeSum, all from the calculation draft except the norm, which is\
            \ taken from the applicant's most recent Lifecare calculation before the\
            \ application month — amountBasis ESTIMATE. Null when no previous norm\
            \ is known (see explanation)"
          examples:
          - 4250
        amountBasis:
          type: string
          description: "Where estimatedAmount (and thereby outcome) comes from: LIFECARE_CALCULATION\
            \ = the normberäkning saved in Lifecare, ESTIMATE = the draft plus the\
            \ previous calculation's norm. Null when there is no amount"
          enum:
          - LIFECARE_CALCULATION
          - ESTIMATE
          examples:
          - LIFECARE_CALCULATION
        normSum:
          type: number
          description: "The norm sum: the saved Lifecare calculation's norm (LIFECARE_CALCULATION),\
            \ or the previous Lifecare calculation's norm the estimate is based on\
            \ (ESTIMATE). Null when unknown"
          examples:
          - 6200
        incomeSum:
          type: number
          description: The draft's income sum (effective amounts)
          examples:
          - 3000
        expenseSum:
          type: number
          description: The draft's expense sum (effective = approved amounts)
          examples:
          - 800
        specialExpenseSum:
          type: number
          description: The draft's special-expense sum (effective = approved amounts)
          examples:
          - 250
        explanation:
          type: string
          description: Why the proposal is incomplete (Swedish) — e.g. no previous
            norm could be read so no amount/outcome was proposed. Null when the proposal
            is complete
          examples:
          - Ingen norm kunde läsas från Lifecare – beloppet kunde inte beräknas.
        reason:
          type: string
          description: "The proposed orsak: the previous Lifecare decision's reason,\
            \ or null when there is none"
          examples:
          - "Arbetslös, ingen ersättning/stöd"
        reasonOptions:
          type: array
          description: "Every orsak the caseworker can pick instead — Lifecare's orsak-catalogue\
            \ (försörjningshinder) in Lifecare's order, plus the previous decision's\
            \ reason(s) when those are not in the catalogue (FamilyCare exposes no\
            \ reason catalogue over the API). The same catalogue applies to the applicant\
            \ and the co-applicant"
          items:
            type: string
        coApplicantReason:
          type: string
          description: "The proposed orsak for the co-applicant (medsökande): the\
            \ previous Lifecare decision's co-applicant reason, or null when there\
            \ is none. Picked from the same reasonOptions catalogue as the applicant's"
          examples:
          - "Sjukskriven m läkarintyg, otillräcklig sjukpenning"
        previousDecision:
          $ref: "#/components/schemas/PreviousDecision"
          description: "The applicant's most recent Lifecare decision, or null when\
            \ none was found (or Lifecare could not be read)"
        warnings:
          type: array
          description: The DECISION-section warnings this proposal raised (reconciled
            on every read)
          items:
            $ref: "#/components/schemas/Warning"
    PreviousDecision:
      type: object
      description: The applicant's most recent Lifecare decision.
      properties:
        type:
          type: string
          description: The Lifecare decision type (free text as Lifecare names it)
          examples:
          - Bifall
        reason:
          type: string
          description: The Lifecare decision reason / orsak (free text)
          examples:
          - "Arbetslös, ingen ersättning/stöd"
        coApplicant:
          type: string
          description: "The co-applicant (medsökande) the decision also concerned,\
            \ as Lifecare names them. Null when the decision had none"
          examples:
          - Astrid Testsson
        coApplicantReason:
          type: string
          description: The co-applicant's own reason / orsak on the decision (free
            text). Null when the decision had no co-applicant
          examples:
          - "Sjukskriven m läkarintyg, otillräcklig sjukpenning"
        periodFrom:
          type: string
          description: The decision period start (raw Lifecare string)
          examples:
          - 2026-05-01
        periodTo:
          type: string
          description: The decision period end (raw Lifecare string)
          examples:
          - 2026-05-31
        amount:
          type: number
          description: The decided amount
          examples:
          - 8500
        date:
          type: string
          description: The decision date (raw Lifecare string)
          examples:
          - 2026-04-28
    SsbtekChange:
      type: object
      description: One income on which the latest SSBTEK answer and the normberäkning
        saved in Lifecare disagree
      properties:
        kind:
          type: string
          description: ADD = SSBTEK reports an income the calculation lacks; CHANGE
            = the calculation has the income at another amount; GONE = an income the
            system wrote to the calculation is no longer reported by SSBTEK
          enum:
          - ADD
          - CHANGE
          - GONE
          examples:
          - CHANGE
        mode:
          type: string
          description: "AUTO = the calculation still holds what the system last wrote\
            \ there (no caseworker has touched the income), so the SSBTEK amount may\
            \ be written without asking; CONFIRM = show it to the caseworker and write\
            \ only on their say-so"
          enum:
          - AUTO
          - CONFIRM
          examples:
          - AUTO
        reason:
          type: string
          description: "Why the change needs confirming; null for AUTO. FINAL = the\
            \ calculation is final and takes no change; NO_BASELINE = careM has no\
            \ record of what the system wrote to this calculation; EDITED = a caseworker\
            \ has changed the amount; REMOVED = the income was taken out of the calculation\
            \ (or never put in) on purpose; MULTIPLE_ROWS = the type has several rows;\
            \ GONE_FROM_SSBTEK = SSBTEK no longer reports it, which does not prove\
            \ it has stopped"
          enum:
          - FINAL
          - NO_BASELINE
          - EDITED
          - REMOVED
          - MULTIPLE_ROWS
          - GONE_FROM_SSBTEK
          examples:
          - EDITED
        role:
          type: string
          description: "Whose income: the applicant (Lifecare's S column) or the co-applicant\
            \ (M)"
          enum:
          - APPLICANT
          - CO_APPLICANT
          examples:
          - APPLICANT
        incomeTypeId:
          type: integer
          format: int32
          description: "The Lifecare income type id, when careM knows it (always for\
            \ ADD)"
          examples:
          - 12
        incomeType:
          type: string
          description: The Lifecare income type name — what the calculation row is
            matched on
          examples:
          - Lön
        ssbtekAmount:
          type: number
          description: The amount SSBTEK gives; null for GONE
          examples:
          - 12400.0
        lifecareAmount:
          type: number
          description: The amount in the calculation (all rows of the type summed);
            null for ADD
          examples:
          - 11900.0
    SsbtekChanges:
      type: object
      description: Where the normberäkning saved in Lifecare no longer matches the
        latest SSBTEK answer
      properties:
        calculationId:
          type: integer
          format: int32
          description: The Lifecare calculation compared (the errand's lifecareCalculationId)
          examples:
          - 48213
        isFinal:
          type: boolean
          description: Whether the calculation is saved as final in Lifecare; if so
            nothing may be written and every change is CONFIRM
          examples:
          - false
        comparedAt:
          type: string
          format: date-time
          description: When the calculation was read from Lifecare for this comparison
          examples:
          - 2026-09-25T09:30:00+02:00
        ssbtekReadAt:
          type: string
          format: date-time
          description: When SSBTEK was last read for the errand; null when it has
            not been read since the calculation was linked
          examples:
          - 2026-09-25T03:00:00+02:00
        changes:
          type: array
          description: "The disagreements, empty when the calculation matches SSBTEK"
          items:
            $ref: "#/components/schemas/SsbtekChange"
    PrefilledChild:
      type: object
      description: "A child pre-filled from Lifecare for a financial assistance renewal.\
