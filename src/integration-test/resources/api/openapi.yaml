  /{municipalityId}/{namespace}/errands/financial-assistance/{errandId}/decision-proposal:
    get:
      tags:
      - Financial Assistance · Proposals
      summary: Read the decision proposal (beslutsförslag)
      description: "The proposed decision for the DECISION tab, derived on every read\
        \ from the calculation draft and the applicant's most recent Lifecare decision\
        \ — never stored. Outcome rule: estimatedAmount <= 0 → AVSLAG; > 0 and every\
        \ expense fully approved → BIFALL; > 0 and any expense approved below its\
        \ applied amount → DELAVSLAG. The amount is an estimate: normSum (the applicant's\
        \ previous Lifecare calculation's norm) + expenseSum + specialExpenseSum −\
        \ incomeSum from the draft; when no previous norm is known the outcome and\
        \ amount are null and 'explanation' says why. Period = the calculation's period;\
        \ reason = the previous decision's orsak and coApplicantReason the co-applicant's\
        \ own orsak on that same decision (both picked from the one 'reasonOptions'\
        \ catalogue). Reading also reconciles the DECISION-section warnings (previous\
        \ decision was förskott på förmån; one per expense not approved in full) and\
        \ returns them. 404 when the errand has no calculation draft."
      operationId: getDecisionProposal
      parameters:
      - name: municipalityId
        in: path
        required: true
        schema:
          type: string
      - name: namespace
        in: path
        required: true
        schema:
          type: string
          pattern: "[\\w\\-]+"
      - name: errandId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionProposal"
        "400":
