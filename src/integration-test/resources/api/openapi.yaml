  /{municipalityId}/{namespace}/errands/financial-assistance/{errandId}/lifecare/decision:
    get:
      tags:
      - Financial Assistance · Lifecare
      summary: Read the errand's beslut as it stands in Lifecare
      description: "The beslut the errand is linked to in Lifecare (lifecareDecisionId),\
        \ read from Lifecare. 204 while no beslut has been saved. The read is logged\
        \ in the errand's Lifecare access log."
      operationId: readDecision
      parameters:
      - name: municipalityId
        in: path
        required: true
        schema:
          type: string
        example: 2281
      - name: namespace
        in: path
        required: true
        schema:
          type: string
          pattern: "[\\w\\-]+"
        example: FINANCIAL_ASSISTANCE
      - name: errandId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecareDecisionView"
        "204":
          description: No beslut saved in Lifecare yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecareDecisionView"
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
