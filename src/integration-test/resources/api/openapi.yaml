          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /{municipalityId}/{namespace}/errands/financial-assistance/actualisations/{actualisationId}/archive:
    post:
      tags:
      - Financial Assistance · Intake
      summary: Archive a document to a Lifecare actualisation
      description: "Binds an uploaded document (e.g. a supplementary application)\
        \ as an attachment to a specific Lifecare actualisation. The target actualisation\
        \ must belong to the given applicant (partyId) — a foreign actualisation id\
        \ yields 404 before anything is uploaded. Multipart request: the 'file' part\
        \ carries the document; the optional 'request' part carries the metadata (errandId,\
        \ title, documentType, documentSenderType, senderName) — title/documentType/documentSenderType/senderName\
        \ each fall back to a server default, and the title defaults to the uploaded\
        \ file name. caremanagement only forwards the bytes to Lifecare. When 'request.errandId'\
        \ is set, the target actualisation id is recorded on that errand as a Decision(ACTUALISATION),\
        \ setting the errand's Lifecare actualisation to the one archived to."
      operationId: archiveToActualisation
      parameters:
      - name: municipalityId
        in: path
        required: true
        schema:
          type: string
      - name: namespace
        in: path
        required: true
        schema:
          type: string
          pattern: "[\\w\\-]+"
      - name: actualisationId
        in: path
        description: The target Lifecare actualisation id
        required: true
        schema:
          type: integer
          format: int32
      - name: partyId
        in: query
        description: The applicant's partyId (personId GUID) that owns the target
          actualisation
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                request:
                  $ref: "#/components/schemas/ArchiveActualisationRequest"
              required:
              - file
      responses:
        "204":
          description: Successful operation
        "502":
          description: Bad Gateway
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/Problem"
                - $ref: "#/components/schemas/ConstraintViolationProblem"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
