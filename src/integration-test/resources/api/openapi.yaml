          examples:
          - 2026-06-01T09:30:00Z
        children:
          type: array
          description: Children included in the application
          items:
            $ref: "#/components/schemas/Child"
        costs:
          type: array
          description: Costs applied for
          items:
            $ref: "#/components/schemas/Cost"
        incomes:
          type: array
          description: Incomes reported
          items:
            $ref: "#/components/schemas/Income"
        pendingBenefits:
          type: array
          description: Pending benefits
          items:
            $ref: "#/components/schemas/PendingBenefit"
        assets:
          type: array
          description: Assets owned
          items:
            $ref: "#/components/schemas/Asset"
        persons:
