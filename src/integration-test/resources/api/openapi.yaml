        latestDecisionPeriodYear:
          type: integer
          format: int32
          description: "Year of the most recent Lifecare decision, when one exists"
          examples:
          - 2026
        hasPreviousCalculation:
          type: boolean
          description: True when Lifecare shows a previous calculation
