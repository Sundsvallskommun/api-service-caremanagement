                - $ref: "#/components/schemas/Problem"
                - $ref: "#/components/schemas/ConstraintViolationProblem"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /{municipalityId}/{namespace}/errands/{typeSlug}:
    post:
      tags:
      - Financial Assistance · Errands
      summary: Create financial assistance errand
      description: "Multipart request. The 'request' part carries the application\
        \ (JSON); the optional 'attachments' part carries the citizen's supporting\
        \ files (any type); the optional 'caseData' part carries the application snapshot\
        \ (ärendeuppgifter), stored as a single CASE_DATA attachment renamed to {errandNumber}.pdf;\
        \ the optional 'formSnapshot' part carries the self-describing JSON snapshot\
        \ of the form exactly as the applicant saw it (every question, help/info/notice\
        \ text, option label and answer), captured write-once for the legal record\
        \ and readable back via GET .../form-snapshot. typeSlug is one of financial-assistance-new,\
        \ financial-assistance-renewal, financial-assistance-supplementary. Each attachment\
        \ is stored on the errand, and a single combined PDF merging them all is generated\
        \ and stored alongside."
      operationId: createErrand_1
      parameters:
      - name: municipalityId
        in: path
        required: true
        schema:
          type: string
      - name: namespace
        in: path
        required: true
        schema:
          type: string
          pattern: "[\\w|\\-]+"
      - name: typeSlug
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                request:
                  $ref: "#/components/schemas/CreateFinancialAssistanceRequest"
                attachments:
                  type: array
                  items:
                    type: string
                    format: binary
                caseData:
                  type: string
                  format: binary
                formSnapshot:
                  type: string
              required:
              - request
        required: true
      responses:
        "201":
          description: Successful operation
          headers:
            Location:
              style: simple
              schema:
                type: string
