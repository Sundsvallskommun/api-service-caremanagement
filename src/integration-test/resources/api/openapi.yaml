    FormSnapshot:
      type: object
      description: Self-describing snapshot of the form as it was rendered and answered.
      properties:
        schemaVersion:
          type: string
          description: The snapshot envelope contract version (server-owned)
          examples:
          - form-snapshot/1
          minLength: 1
        formDefinitionVersion:
          type: string
          description: The frontend form / i18n bundle version that produced this
            snapshot
          examples:
          - eb-2026.06-r3
        typeSlug:
          type: string
          description: The errand type slug the form belongs to
          examples:
          - financial-assistance-new
        locale:
          type: string
          description: The locale the form was rendered in
          examples:
          - sv-SE
        capturedAt:
          type: string
          format: date-time
          description: "When the form was rendered/submitted, per the client clock"
          examples:
          - 2026-06-24T10:15:30+02:00
        title:
          type: string
          description: The form title the applicant saw
          examples:
          - Ansökan om ekonomiskt bistånd
        sections:
          type: array
          description: "The sections of the form, in render order"
          items:
            $ref: "#/components/schemas/FormSnapshotSection"
          minItems: 1
        attestation:
          $ref: "#/components/schemas/FormSnapshotAttestation"
          description: "The attestation the applicant accepted, if any"
      required:
      - schemaVersion
      - sections
    FormSnapshotAnswer:
      type: object
      description: "The answer given to a field, as it was presented to the applicant."
      properties:
        code:
          type: string
          description: "The option code, when the answer is an enum/option value;\
            \ null otherwise"
          examples:
          - SINGLE
        value:
          type: string
          description: "The raw value, when the answer is free text / number / boolean;\
            \ null otherwise"
          examples:
          - "12000"
        display:
          type: string
          description: The human-readable answer text the applicant saw
          examples:
          - Ensamstående
    FormSnapshotAttestation:
