    post:
      tags:
      - Financial Assistance · Calculation
      summary: Create the calculation in Lifecare straight from the application (nyansökan)
      description: "Builds the calculation from the data the citizen declared in the\
        \ application — incomes resolved to FC types by name, expenses and household\
        \ from the same feeder the renewal path uses — and creates it in Lifecare\
        \ FC in one shot, returning the created calculation id. No SSBTEK, no daily\
        \ loop, no caseworker draft. Used by the nyansökan process."
      operationId: commitFromApplication
