        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: Bad Gateway - Lifecare could not be reached or answered with
            an error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    put:
      tags:
      - Financial Assistance · Lifecare
      summary: "Save the errand's beslut in Lifecare - created the first time, changed\
        \ after that"
      description: "Writes the beslut to Lifecare: Decision/Create the first time,\
        \ after which the errand is linked to it (lifecareDecisionId) in the same\
        \ call, and Decision/Update of that same beslut every time after. The beslutsfattare\
        \ is the caller (X-Sent-By), who must be one of Lifecare's beslutsfattare\
        \ for the insats. Refused with 422, worded for the caseworker, when the beslutstyp\
        \ is not active on the insats or cannot be registered from careM, the household\
        \ has a medsökande, the caller is not a beslutsfattare, a period the beslutstyp\
        \ requires is missing, the beslut is locked in Lifecare, or an existing beslut\
        \ would change beslutstyp; Lifecare's own refusals are 422 with Lifecare's\
        \ message. 502 when Lifecare did not answer the create (check Lifecare before\
        \ saving again) or when the beslut was created but could not be linked to\
        \ the errand (do not save again). Answers with the beslut as it stands in\
        \ Lifecare after the save."
      operationId: saveDecision
      parameters:
      - name: municipalityId
        in: path
        required: true
        schema:
          type: string
        example: 2281
      - name: namespace
        in: path
        required: true
        schema:
          type: string
          pattern: "[\\w\\-]+"
        example: FINANCIAL_ASSISTANCE
      - name: errandId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LifecareDecisionSaveRequest"
        required: true
      responses:
        "200":
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecareDecisionView"
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Conflict - the errand has no Lifecare insats yet
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Unprocessable - the beslut cannot be saved as it stands
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/Problem"
                - $ref: "#/components/schemas/ConstraintViolationProblem"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: Bad Gateway - Lifecare could not be reached or answered with
            an error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
