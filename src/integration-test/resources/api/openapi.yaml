    Decision:
      type: object
      description: "Decision recorded against an errand. Both system-generated decisions\
        \ (e.g. a DMN-evaluated recommendation produced by a BPMN process) and human\
        \ decisions (e.g. a caseworker approving a payment) are stored here, distinguished\
        \ by `decisionType`. The list on the errand grows over time and is the audit\
        \ trail of every decision made on the case."
      properties:
        id:
          type: string
          description: Unique identifier
          examples:
          - cb20c51f-fcf3-42c0-b613-de563634a8ec
          readOnly: true
        decisionType:
          type: string
          description: "Decision category. Free-form string; conventionally `RECOMMENDATION`\
            \ for DMN-produced suggestions and `PAYMENT` for caseworker APPROVE/REJECT\
            \ decisions, but namespaces are encouraged to define their own."
          examples:
          - PAYMENT
          maxLength: 32
          minLength: 0
        value:
          type: string
          description: Decision value. For binary outcomes use `APPROVED`/`REJECTED`;
            for richer outputs (e.g. a calculated amount) use the value itself or
            a short label.
          examples:
          - APPROVED
          maxLength: 255
          minLength: 0
        description:
          type: string
          description: Optional human-readable description or motivation for the decision
          examples:
          - "Decision proposal per ruleset: 7900 kr, no warning"
          maxLength: 4096
          minLength: 0
        coApplicantReason:
          type: string
          description: "The co-applicant's orsak, when the household has a co-applicant\
            \ and the decision carries one; description carries the applicant's."
          examples:
          - Beviljad
          maxLength: 255
          minLength: 0
        amount:
          type: number
          description: "Optional decision amount, in SEK. For a financial-assistance\
            \ decision this is the granted amount (0 for a rejection); for a recommendation\
            \ it is the recommended amount when the pipeline has computed one."
          examples:
          - 7900.0
        decisionMessage:
          type: string
          description: "Optional decision message communicated to the applicant —\
            \ the free-text justification shown on the decision letter, kept separate\
            \ from the internal `description`."
          examples:
          - Du beviljas ekonomiskt bistånd för juni 2026 enligt riksnorm.
          maxLength: 8192
          minLength: 0
        decisionDate:
          type: string
          format: date
          description: "Optional date the decision applies (the caseworker-chosen\
            \ decision date), distinct from the server-assigned `created` audit timestamp."
          examples:
          - 2026-06-18
        periodFrom:
          type: string
          format: date
          description: "Optional start of the period the decision covers (the month\
            \ applied for, for a financial-assistance decision)."
          examples:
          - 2026-06-01
        periodTo:
          type: string
          format: date
          description: Optional end of the period the decision covers.
          examples:
          - 2026-06-30
        createdBy:
          type: string
          description: "Identifier of the actor that produced the decision. Use the\
            \ caseworker userId for human decisions or a system identifier (e.g. `operaton`,\
            \ `dmn-engine`) for automated ones."
          examples:
          - jane01doe
          maxLength: 64
          minLength: 0
        lifecareStatus:
          type: string
          description: "Where the decision stands in Lifecare: PENDING once handed\
            \ over to be written there, SYNCED once written, FAILED when Lifecare\
            \ refused it (see lifecareDetail). Null for a decision that is never written\
            \ to Lifecare."
          enum:
          - PENDING
          - SYNCED
          - FAILED
          examples:
          - SYNCED
          readOnly: true
        lifecareId:
          type: string
          description: "The decision's id in Lifecare, once written there"
          examples:
          - "88123"
          readOnly: true
        lifecareDetail:
          type: string
          description: Lifecare's own message when writing the decision failed — shown
            to the caseworker as-is
          examples:
          - Beslutet kunde inte registreras
          readOnly: true
        created:
          type: string
          format: date-time
          description: Timestamp the decision was recorded (server-assigned)
          readOnly: true
    DecisionLifecareResult:
