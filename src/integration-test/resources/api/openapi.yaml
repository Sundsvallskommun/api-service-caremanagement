    post:
      tags:
      - Financial Assistance · Calculation
      summary: Prepare the calculation (no Lifecare write)
      description: "Reports whether this month's classified incomes cover every income\
        \ type the previous calculation had (informationComplete + missingIncomeTypes),\
        \ records the income warnings on the errand as a single Decision(RECOMMENDATION),\
        \ and reflects completeness in the errand status (SUPPLEMENT_REQUESTED ⇄ AWAITING_DECISION).\
        \ Does NOT create a calculation in Lifecare — the EB process calls this each\
        \ daily loop. Use /commit after a decision to create it in Lifecare."
      operationId: prepareCalculation
      parameters:
      - name: municipalityId
        in: path
        required: true
        schema:
          type: string
      - name: namespace
        in: path
        required: true
        schema:
