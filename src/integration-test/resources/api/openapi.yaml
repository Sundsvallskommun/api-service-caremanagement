  /{municipalityId}/{namespace}/errands/financial-assistance/payment-status:
    post:
      tags:
      - Financial Assistance · Payment
      summary: Read whether the Lifecare payment has been effectuated
      description: "Reads from Lifecare whether the payments of a bifall have been\
        \ paid out, returning the effectuated flag, the payment date when effectuated,\
        \ the reason when not, and the working-day deadline with an overdue flag.\
        \ With errandId the check is errand-specific: the Lifecare payments linked\
        \ to the errand (lifecarePaymentIds) must all be reported paid; otherwise\
        \ the applicant's Lifecare payments on the errand's own insats for the application\
        \ month are used, never one another errand references, and once they are all\
        \ paid they are linked to the errand. Overdue only after the deadline of three\
        \ working days from the decision. Without errandId, any payment for the applicant\
        \ and application month counts. caremanagement makes no payment; the process\
        \ polls this to detect when it is done."
      operationId: checkPaymentStatus
      parameters:
      - name: municipalityId
        in: path
        required: true
        schema:
          type: string
      - name: namespace
        in: path
        required: true
        schema:
          type: string
          pattern: "[\\w\\-]+"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentStatusRequest"
        required: true
      responses:
        "200":
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentStatusResponse"
        "502":
          description: Bad Gateway
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/Problem"
                - $ref: "#/components/schemas/ConstraintViolationProblem"
        "500":
