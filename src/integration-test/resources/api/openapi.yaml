  /{municipalityId}/{namespace}/errands/financial-assistance/calculation/prepare:
    post:
      tags:
      - Financial Assistance · Calculation
      summary: Prepare the calculation (no Lifecare write)
      description: "Reports whether this month's classified incomes cover every income\
        \ type the previous calculation had (informationComplete + missingIncomeTypes),\
        \ records the income warnings on the errand as a single Decision(RECOMMENDATION),\
        \ and reflects completeness in the errand status (SUPPLEMENT_REQUESTED ⇄ AWAITING_DECISION).\
        \ The first run that finds the information complete, on an errand without\
        \ lifecareCalculationId, creates the draft in Lifecare as the normberäkning\
        \ proposal and sets lifecareCalculationId (best-effort: a failed create is\
        \ retried by the next run, and Draken may create the calculation itself meanwhile).\
        \ Once lifecareCalculationId is set, the draft is no longer refreshed and\
        \ its warnings stay as they were; the SSBTEK warnings, recommendation and\
        \ status still update. The financial assistance process calls this each daily\
        \ loop."
      operationId: prepareCalculation
      parameters:
      - name: municipalityId
        in: path
        required: true
        schema:
          type: string
      - name: namespace
        in: path
        required: true
        schema:
          type: string
          pattern: "[\\w\\-]+"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalculationRequest"
        required: true
      responses:
        "200":
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalculationResponse"
        "502":
          description: Bad Gateway
          content:
