  /{municipalityId}/{namespace}/errands/financial-assistance/{errandId}/lifecare/documents/journal-notes/{id}:
    get:
      tags:
      - Financial Assistance · Lifecare
      summary: Read a journalanteckning with its body
      description: One of the applicant's journalanteckningar with its body and whether
        it may still be edited. 404 when the record is not in the applicant's Lifecare
        record.
      operationId: readJournalNote
      parameters:
      - name: municipalityId
        in: path
        required: true
        schema:
          type: string
      - name: namespace
        in: path
        required: true
        schema:
          type: string
          pattern: "[\\w\\-]+"
      - name: errandId
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: The Lifecare record id
        required: true
        schema:
          type: integer
          format: int32
          exclusiveMinimum: 0
      responses:
        "200":
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecareRecordContent"
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
